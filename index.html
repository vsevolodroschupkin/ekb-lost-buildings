<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исчезнувшие здания Екатеринбурга</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7272b37b-ea30-4f26-a805-8c385c269023
    &lang=ru_RU" type="text/javascript"></script>
</head>
<body>
    <header>
      <div class="container">
      <h1>Исчезнувшие здания Екатеринбурга</h1>
      <p>Интерактивная карта объектов культурного наследия в период с 1991 по 2025 год.</p>
      </div>
    </header>
    <main>
      <div class="main-container">
        <div class="panel control-panel">
          <h3 class="control-panel-header">Фильтр сноса ОКН</h3>
            <p class="control-panel-description">Чем ближе к 2025 году, тем больше зданий мы теряем</p>
            <div class="filter-group">
              <div class="slider-value" id="year-value">Год: 2020</div>
              <div class="slider-container">
                <div id="year-slider" class="year-slider"></div>
                <div class="slider-labels">
                  <span>1990</span>
                  <span>2025</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="panel details-panel" id="details-panel" style="display: none;">
          <button class="close-btn" id="close-details">×</button>
          <div class="details-content" id="details-content"></div>
        </div>
        <div id="map"></div>
    </main>
    <footer>
      <div class="container">
        <p class="footer-copyright"> ©Самарцева Ксения, 2025 </p>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.js"></script>
    <script src="js/data.js" type="module"></script>
    <script src="js/slider.js" type="module"></script>
    <script src="js/app.js" type="module"></script>
</body>
</html>
